<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d9488">
    <title>Sin conexión · ReservaPro</title>
    <link rel="icon" href="/icons/icon.svg">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #1e293b; font-family: ui-sans-serif, system-ui, sans-serif; }
        main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
        img { width: 4rem; height: 4rem; }
        h1 { margin: 1.25rem 0 .5rem; font-size: 1.25rem; color: #0f172a; }
        p { margin: 0; color: #64748b; line-height: 1.5; }
        button { margin-top: 1.5rem; padding: .625rem 1.25rem; border: 0; border-radius: .5rem; background: #0d9488; color: #fff; font: 600 .875rem/1 inherit; cursor: pointer; }
        button:hover { background: #14b8a6; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon.svg" alt="">
        <h1>Sin conexión</h1>
        <p>ReservaPro necesita internet para mostrar la agenda y los horarios al día. Revisa tu conexión e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
