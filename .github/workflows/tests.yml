name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    name: Docker image

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t reservapro .

      - name: Boot the container and check health
        run: |
          docker run -d --name reservapro -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://localhost:8080 \
            reservapro
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null; then
              curl -fsS http://localhost:8080/ | grep -q "ReservaPro" || exit 1
              logo=$(curl -fsS http://localhost:8080/reservar/barberia-demo | grep -o 'http://localhost:8080/storage/businesses/[^"]*' | head -n 1)
              test -n "$logo" && curl -fsS -o /dev/null "$logo" && exit 0
              echo "The demo logo is not served"
              docker logs reservapro
              exit 1
            fi
            sleep 2
          done
          docker logs reservapro
          exit 1
